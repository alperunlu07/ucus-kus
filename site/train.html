<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kağıt Kuş · Tren Atölyesi</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#efe8da;font-family:system-ui,sans-serif;touch-action:none}
#hud{position:fixed;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#4a4552;font-size:14px;pointer-events:none}
#hud b{background:#fffaf0ee;padding:6px 10px;border-radius:10px;box-shadow:0 1px 3px #0002}#hud a{pointer-events:auto;background:#e8766b;color:#fff;text-decoration:none;padding:6px 12px;border-radius:10px}
.bar{position:fixed;display:flex;gap:6px;flex-wrap:wrap}.bar button{border:0;border-radius:10px;padding:8px 11px;background:#fffaf0;color:#4a4552;box-shadow:0 1px 3px #0002;font-size:14px}.bar button.on{background:#7aa35a;color:#fff}
#views{right:12px;bottom:16px;flex-direction:column}#acts{left:12px;bottom:16px}#sw{left:12px;bottom:62px}#sw button{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid #fffaf0}</style>
<script type="importmap">{"imports":{"three":"./lib/three.js"}}</script></head><body>
<div id="hud"><b>🚂 Tren atölyesi</b><a href="./">Oyuna dön</a></div>
<div id="views" class="bar"><button data-v="0">Üst</button><button data-v="1" class="on">3/4</button><button data-v="2">Yan</button><button data-v="3">Yakın</button></div>

<div id="acts" class="bar"><button data-a="idle">Dur</button><button data-a="run" class="on">Sür</button><button data-a="fast">Hızlı</button></div>
<script type="module" src="./train.js"></script></body></html>
