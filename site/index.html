<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ead8">
<title>Kağıt Kuş</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3ead8;touch-action:none;-webkit-user-select:none;user-select:none;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
canvas{display:block;touch-action:none}
#paper{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:3;pointer-events:none}
.pill{background:rgba(255,250,240,.82);color:#6b5b4a;padding:7px 14px;border-radius:20px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(90,70,40,.15)}
#hint{position:fixed;bottom:16%;left:0;right:0;text-align:center;z-index:3;color:#6b5b4a;font-weight:700;font-size:18px;pointer-events:none;transition:opacity 1s;text-shadow:0 1px 6px #fff8}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;z-index:3;color:#fff;font-weight:800;font-size:22px;opacity:0;transition:opacity .4s;text-shadow:0 2px 8px rgba(90,60,30,.5);pointer-events:none}
#start{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(243,234,216,.55);color:#5d4b3a}
#start h1{font-size:40px;margin:0 0 6px}#start p{margin:4px;opacity:.8}
#start button{margin-top:18px;font:inherit;font-weight:800;font-size:20px;border:0;border-radius:30px;padding:14px 34px;background:#f6a96b;color:#fff;box-shadow:0 4px 0 #d9874b}
#btns{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:10px}#btns button{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,250,240,.85);font-size:20px;box-shadow:0 2px 8px rgba(90,70,40,.15)}#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff6d8,transparent 70%);opacity:0;pointer-events:none;z-index:2}#best{font-weight:800;color:#d9874b}#album{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(243,234,216,.6)}#album .sheet{background:#fffaf0;border-radius:18px;padding:18px;width:min(86vw,420px);max-height:76vh;overflow:auto;color:#5d4b3a;box-shadow:0 6px 24px rgba(90,70,40,.25);text-align:center}#album h2{margin:0}#albumList{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.ac{background:#fff;border:2px dashed #e8766b;border-radius:10px;padding:10px 6px;font-size:13px;display:flex;flex-direction:column;gap:4px}.ac small{color:#d9874b}.ac.lock{border-color:#ddd;opacity:.55}#albumClose{font:inherit;font-weight:800;border:0;border-radius:20px;padding:10px 26px;background:#f6a96b;color:#fff}</style></head><body>
<svg id="paper" width="100%" height="100%" preserveAspectRatio="none"><defs>
<filter id="torn"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
<filter id="fib"><feTurbulence baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .06 0"/></filter>
<mask id="m"><rect width="100%" height="100%" fill="#fff"/><rect x="2.2%" y="1.6%" width="95.6%" height="96.8%" rx="6" fill="#000" filter="url(#torn)"/></mask></defs>
<rect width="100%" height="100%" fill="#f3ead8" mask="url(#m)"/>
<rect width="100%" height="100%" filter="url(#fib)"/></svg>
<div id="hud"><span class="pill" id="dist">0 m</span><span class="pill" id="coll">✦ 0</span><span class="pill" id="post" style="transition:transform .3s">✉ 0</span></div><div id="btns"><button id="albumBtn">✉</button><button id="qual">✨</button><button id="mute">🔊</button><button id="tilt" style="opacity:.5" title="Eğme kontrolü">📱</button></div><div id="flash"></div>
<div id="hint">☝️ parmakla yönlendir</div><div id="toast"></div>
<div id="start"><h1>Kağıt Kuş</h1><p>Minik dünyanın üzerinde süzül.</p><p>Parıltıları ve kartpostalları topla.</p><p id="best"></p><button id="go">Uç!</button><button id="albumBtn2" style="background:#fffaf0;color:#d9874b;box-shadow:0 3px 0 #e8d6bb;font-size:16px;padding:10px 22px">✉ Albüm</button></div>
<script type="importmap">{"imports":{"three":"./lib/three.js"}}</script>
<script type="module" src="./game.js"></script><div id="album"><div class="sheet"><h2>✉ Albüm</h2><p id="albumCount"></p><div id="albumList"></div><button id="albumClose">Kapat</button></div></div></body></html>
