<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f3ead8">
<title>Kağıt Kuş</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3ead8;touch-action:none;-webkit-user-select:none;user-select:none;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
canvas{display:block;touch-action:none}
#paper{position:fixed;inset:0;pointer-events:none;z-index:2}
#hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:3;pointer-events:none}
.pill{background:rgba(255,250,240,.82);color:#6b5b4a;padding:7px 14px;border-radius:20px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(90,70,40,.15)}
#hint{position:fixed;bottom:16%;left:0;right:0;text-align:center;z-index:3;color:#6b5b4a;font-weight:700;font-size:18px;pointer-events:none;transition:opacity 1s;text-shadow:0 1px 6px #fff8}
#toast{position:fixed;top:22%;left:0;right:0;text-align:center;z-index:3;color:#fff;font-weight:800;font-size:22px;opacity:0;transition:opacity .4s;text-shadow:0 2px 8px rgba(90,60,30,.5);pointer-events:none}
#start{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(243,234,216,.55);color:#5d4b3a}
#start h1{font-size:40px;margin:0 0 6px}#start p{margin:4px;opacity:.8}
#start button{margin-top:18px;font:inherit;font-weight:800;font-size:20px;border:0;border-radius:30px;padding:14px 34px;background:#f6a96b;color:#fff;box-shadow:0 4px 0 #d9874b}
#btns{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:10px}#btns button{width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,250,240,.85);font-size:20px;box-shadow:0 2px 8px rgba(90,70,40,.15)}#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff6d8,transparent 70%);opacity:0;pointer-events:none;z-index:2}#best{font-weight:800;color:#d9874b}#album{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(243,234,216,.6)}#album .sheet{background:#fffaf0;border-radius:18px;padding:18px;width:min(86vw,420px);max-height:76vh;overflow:auto;color:#5d4b3a;box-shadow:0 6px 24px rgba(90,70,40,.25);text-align:center}#album h2{margin:0}#albumList{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.ac{background:#fff;border:2px dashed #e8766b;border-radius:10px;padding:10px 6px;font-size:13px;display:flex;flex-direction:column;gap:4px}.ac small{color:#d9874b}.ac.lock{border-color:#ddd;opacity:.55}#albumClose{font:inherit;font-weight:800;border:0;border-radius:20px;padding:10px 26px;background:#f6a96b;color:#fff}#goal{position:fixed;top:calc(max(18px,env(safe-area-inset-top)) + 44px);left:50%;transform:translateX(-50%);z-index:3;font-size:13px;white-space:nowrap;pointer-events:none}.ac span{color:#7a6a58;font-size:12px}.stamp{background:#e8766b;color:#fff;border-radius:4px;padding:1px 4px;font-size:10px}#summary{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(243,234,216,.6)}#summary .sheet{background:#fffaf0;border-radius:18px;padding:18px;width:min(86vw,400px);max-height:80vh;overflow:auto;color:#5d4b3a;text-align:center;box-shadow:0 6px 24px rgba(90,70,40,.25)}#sumBody div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px dashed #eadbc4}.gl{text-align:left;font-size:13px;padding-left:10px;list-style:none}#summary button{font:inherit;font-weight:800;border:0;border-radius:20px;padding:10px 22px;background:#f6a96b;color:#fff;margin:4px}#skins{display:flex;gap:8px;margin-top:10px}.sk{font:inherit;font-size:13px;border:2px solid #e8d6bb;background:#fffaf0;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;color:#5d4b3a}.sk.on{border-color:#f6a96b}.sk.lk{opacity:.55}.sk i{width:14px;height:14px;border-radius:7px;border:3px solid;display:inline-block}#btns{align-items:center}#menu{display:none;flex-direction:column;gap:8px;background:rgba(255,250,240,.6);padding:6px;border-radius:26px}#menu.open{display:flex}#btns button.big{width:58px;height:58px;border-radius:29px;font-size:26px;background:rgba(255,250,240,.92)}#menu button{width:40px;height:40px;font-size:18px}#tut{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(243,234,216,.55)}#tutCard{background:#fffaf0;border-radius:20px;padding:22px 26px;width:min(78vw,340px);text-align:center;color:#5d4b3a;box-shadow:0 6px 24px rgba(90,70,40,.25)}#tutCard .ti{font-size:44px}#tutCard h3{margin:8px 0 4px}#tutCard p{margin:0 0 10px}#tutCard small{color:#d9874b}#tutSkip{margin-top:14px;font:inherit;border:0;background:none;color:#8a7864;text-decoration:underline}#settings{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(243,234,216,.6)}#settings .sheet{background:#fffaf0;border-radius:18px;padding:18px 22px;width:min(84vw,360px);color:#5d4b3a;box-shadow:0 6px 24px rgba(90,70,40,.25)}#settings h2{margin:0 0 10px;text-align:center}#settings label{display:flex;flex-direction:column;gap:6px;margin:10px 0;font-weight:700;font-size:14px}#settings label.ck{flex-direction:row;align-items:center}#settings input[type=range]{accent-color:#f6a96b;width:100%}#settings input[type=checkbox]{width:20px;height:20px;accent-color:#f6a96b}#setClose{display:block;margin:12px auto 0;font:inherit;font-weight:800;border:0;border-radius:20px;padding:10px 26px;background:#f6a96b;color:#fff}#start button.sk{margin-top:0;font-size:13px;font-weight:700;padding:6px 10px;border-radius:14px;background:#fffaf0;color:#5d4b3a;box-shadow:none;border:2px solid #e8d6bb}#start button.sk.on{border-color:#f6a96b}#albTabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.tab{font:inherit;font-size:12px;border:2px solid #e8d6bb;background:#fff;border-radius:12px;padding:4px 8px;color:#5d4b3a}.tab.on{border-color:#e8766b;background:#fde9e3}.gl2{margin:10px 0;font-size:14px}.gl2 div{display:flex;gap:6px;margin-top:6px}.gfx{flex:1;font:inherit;font-weight:700;border:2px solid #e8d6bb;background:#fff;border-radius:12px;padding:6px;color:#5d4b3a}.gfx.on{border-color:#f6a96b;background:#fde9d6}#start #codeIn{margin-top:10px}</style></head><body>
<svg id="paper" width="100%" height="100%" preserveAspectRatio="none"><defs>
<filter id="torn"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
<filter id="fib"><feTurbulence baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .06 0"/></filter>
<mask id="m"><rect width="100%" height="100%" fill="#fff"/><rect x="2.2%" y="1.6%" width="95.6%" height="96.8%" rx="6" fill="#000" filter="url(#torn)"/></mask></defs>
<rect width="100%" height="100%" fill="#f3ead8" mask="url(#m)"/>
<rect width="100%" height="100%" filter="url(#fib)"/></svg>
<div id="hud"><span class="pill" id="dist">0 m</span><span class="pill" id="coll">✦ 0</span><span class="pill" id="post" style="transition:transform .3s">✉ 0</span></div><div id="btns"><div id="menu"><button id="setBtn">⚙️</button><button id="stop" title="Konakla">🏁</button><button id="albumBtn">✉</button><button id="qual">✨</button><button id="mute">🔊</button><button id="tilt" style="opacity:.5" title="Eğme kontrolü">📱</button></div><button id="menuBtn">☰</button><button id="boostBtn" class="big">💨</button></div><div id="flash"></div>
<div id="goal" class="pill"></div><div id="hint">☝️ parmakla yönlendir · çift dokun: hızlan</div><div id="toast"></div>
<div id="start"><h1>Kağıt Kuş</h1><p>Minik dünyanın üzerinde süzül.</p><p>Parıltıları ve kartpostalları topla.</p><p id="best"></p><p id="daily" style="font-size:14px;text-align:center"></p><div id="skins"></div><button id="go">Uç!</button><button id="codeIn" style="background:#fffaf0;color:#7aa6c2;box-shadow:0 3px 0 #e8d6bb;font-size:15px;padding:8px 18px">🔑 Kod gir</button><button id="albumBtn2" style="background:#fffaf0;color:#d9874b;box-shadow:0 3px 0 #e8d6bb;font-size:16px;padding:10px 22px">✉ Albüm</button></div>
<script type="importmap">{"imports":{"three":"./lib/three.js"}}</script>
<script type="module" src="./game.js"></script><div id="album"><div class="sheet"><h2>✉ Albüm</h2><p id="albumCount"></p><div id="albTabs"></div><div id="albumList"></div><button id="albumClose">Kapat</button></div></div><div id="summary"><div class="sheet"><h2 id="sumTitle"></h2><div id="sumBody"></div><button id="share" style="background:#7aa6c2">Paylaş</button> <button id="shareImg" style="background:#9bc49a">Paylaş görsel</button> <button id="codeCopy" style="background:#c9a0dc">Kod kopyala</button> <button id="sumGo">Tekrar uç</button> <button id="sumCont" style="background:#fffaf0;color:#d9874b">Devam et</button></div></div><div id="tut"><div id="tutCard"></div><button id="tutSkip">Geç</button></div><div id="settings"><div class="sheet"><h2>⚙️ Ayarlar</h2>
<label>Ses düzeyi<input id="sVol" type="range" min="0" max="1" step="0.05"></label>
<label>Yönlendirme hassasiyeti<input id="sSens" type="range" min="0.5" max="2" step="0.1"></label>
<div class="gl2"><b>Grafik</b><div><button class="gfx" data-g="low">Düşük</button><button class="gfx" data-g="mid">Orta</button><button class="gfx" data-g="high">Yüksek</button></div></div><label class="ck"><input id="sGhost" type="checkbox"> Hayalet kuşu göster</label>
<label class="ck"><input id="sInv" type="checkbox"> Yukarı/aşağı ters</label>
<label class="ck"><input id="sFast" type="checkbox"> Hızlı gün döngüsü (test)</label>
<button id="setClose">Kapat</button></div></div></body></html>
